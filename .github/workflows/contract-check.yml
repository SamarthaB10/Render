name: Render contract

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contract:check
      - run: npm run typecheck
      - run: npm test
      - run: swift test
